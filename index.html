<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Дневник и Планировщик</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121220;
            --bg-light: #1e1e32;
            --primary: #e94560;
            --accent: #0f3460;
            --text: #fff;
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- ЛЕТАЮЩИЙ ФОН --- */
        #bg-animations {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .floating-item {
            position: absolute; opacity: 0.1; animation: floatAnim infinite linear;
        }
        @keyframes floatAnim {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* --- ВЕРХНЕЕ МЕНЮ --- */
        .top-nav {
            display: flex; justify-content: center; gap: 10px;
            padding: 15px; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px); z-index: 10;
            border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            padding: 10px 25px; border-radius: 20px;
            font-size: 16px; font-weight: 900; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
            background: transparent; color: #aaa;
        }
        .nav-btn.active {
            background: var(--primary); color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        /* --- ОБЩИЕ ЭКРАНЫ --- */
        .screen {
            display: none; flex: 1; width: 100%;
            overflow: hidden; flex-direction: column;
            z-index: 10;
        }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 1. РАСПИСАНИЕ --- */
        .table-controls {
            padding: 10px 20px; display: flex; gap: 10px; justify-content: flex-end;
        }
        .ctrl-btn {
            background: var(--accent); color: white; border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
        }

        .table-wrapper {
            flex: 1; overflow: auto; padding: 0 20px 20px 20px;
        }
        table {
            border-collapse: collapse; width: 100%; min-width: 800px;
            background: rgba(255,255,255,0.03); border-radius: 10px; overflow: hidden;
        }
        th, td {
            border: 1px solid var(--border); padding: 8px; text-align: center;
        }
        th {
            background: rgba(15, 52, 96, 0.9); color: white; font-weight: 900;
            position: sticky; top: 0; outline: none; min-width: 40px;
        }
        /* Колонки День и Время фиксированной ширины */
        th:nth-child(1), td:nth-child(1) { text-align: left; width: 150px; min-width: 150px; }
        th:nth-child(2), td:nth-child(2) { width: 80px; min-width: 80px; }

        td { font-size: 15px; outline: none; transition: background 0.2s; }
        td:focus, th:focus { background: rgba(233, 69, 96, 0.2); }
        
        input[type="checkbox"] {
            width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary);
        }
        input[type="time"] {
            background: transparent; border: none; color: white;
            font-size: 14px; font-weight: bold; outline: none; color-scheme: dark; width: 100%;
        }

        /* --- 2. ДНЕВНИК --- */
        #diary-screen {
            padding: 20px;
            background: url('https://www.transparenttextures.com/patterns/notebook.png'); /* Эффект бумаги */
        }
        .diary-container {
            flex: 1; background: #fffde7; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; overflow: hidden;
            border-left: 5px solid #ff5252; /* Красная линия как в тетради */
        }
        .diary-tools {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            padding: 15px; background: #fff9c4; border-bottom: 1px solid #ddd;
        }
        .diary-tools select, .diary-tools input[type="color"] {
            padding: 5px; border-radius: 5px; border: 1px solid #ccc;
            font-weight: bold; cursor: pointer;
        }
        .mood-btn {
            font-size: 20px; background: none; border: none; cursor: pointer;
            opacity: 0.5; transition: 0.2s;
        }
        .mood-btn.active { opacity: 1; transform: scale(1.2); }

        #diary-text {
            flex: 1; padding: 30px; font-family: 'Caveat', cursive;
            font-size: 24px; line-height: 1.5; color: #222;
            border: none; resize: none; outline: none; background: transparent;
        }

        /* Индикатор сохранения */
        #save-indicator {
            position: fixed; bottom: 20px; right: 20px;
            background: #2ed573; color: white; padding: 10px 20px;
            border-radius: 30px; font-weight: bold; opacity: 0;
            transition: opacity 0.3s; pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="bg-animations"></div>

    <div class="top-nav">
        <button class="nav-btn active" onclick="switchTab('schedule')">📅 Расписание</button>
        <button class="nav-btn" onclick="switchTab('diary')">✍️ Дневник</button>
    </div>

    <!-- РАСПИСАНИЕ -->
    <div id="schedule-screen" class="screen active">
        <div class="table-controls">
            <button class="ctrl-btn" onclick="addColumn()">+ Добавить день</button>
            <button class="ctrl-btn" onclick="addRow()">+ Добавить строку</button>
        </div>
        <div class="table-wrapper">
            <table id="schedule-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- ДНЕВНИК -->
    <div id="diary-screen" class="screen">
        <div class="diary-container">
            <div class="diary-tools">
                <select id="diary-day-select" onchange="loadDiary()">
                    <!-- Заполняется в JS -->
                </select>
                
                <div style="display:flex; gap:5px;">
                    <button class="mood-btn" onclick="setMood('😊')" id="mood-1">😊</button>
                    <button class="mood-btn" onclick="setMood('😢')" id="mood-2">😢</button>
                    <button class="mood-btn" onclick="setMood('😡')" id="mood-3">😡</button>
                    <button class="mood-btn" onclick="setMood('😴')" id="mood-4">😴</button>
                </div>

                <input type="color" id="diary-color" value="#222222" onchange="changeDiaryColor()" title="Цвет чернил">
            </div>
            <textarea id="diary-text" placeholder="День первый. Сегодня я проснулся и подумал..." oninput="saveDiary()"></textarea>
        </div>
    </div>

    <div id="save-indicator">Сохранено ✓</div>

    <script>
        // --- ФОН ---
        const bgContainer = document.getElementById('bg-animations');
        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-item');
            el.textContent = ['📅', '✍️', '⏰', '📖', '✨'][Math.floor(Math.random() * 5)];
            el.style.fontSize = (30 + Math.random() * 40) + 'px';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.animationDuration = (15 + Math.random() * 20) + 's';
            bgContainer.appendChild(el);
        }

        // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---
        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId + '-screen').classList.add('active');
            event.target.classList.add('active');
        }

        // ==========================================
        // ЛОГИКА РАСПИСАНИЯ
        // ==========================================
        // Начальные данные (как на твоей картинке)
        let scheduleData = JSON.parse(localStorage.getItem('mySchedule')) || {
            columns: ["1", "2", "3", "4", "5", "6", "7"], // Заголовки дней (редактируемые)
            rows: [
                { name: "Падём", time: "08:00", checks: [false, false, false, false, false, false, false] },
                { name: "Умывание", time: "08:15", checks: [false, false, false, false, false, false, false] },
                { name: "Спорт", time: "08:25", checks: [false, false, false, false, false, false, false] },
                { name: "Завтрак", time: "08:40", checks: [false, false, false, false, false, false, false] },
                { name: "Уроки", time: "09:00", checks: [false, false, false, false, false, false, false] }
            ]
        };

        function renderSchedule() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            // Рисуем шапку
            let headHtml = `<tr>
                <th contenteditable="true" onblur="editColName(-2, this.textContent)">Расписание</th>
                <th contenteditable="true" onblur="editColName(-1, this.textContent)">Время</th>`;
            scheduleData.columns.forEach((col, index) => {
                headHtml += `<th contenteditable="true" onblur="editColName(${index}, this.textContent)">${col}</th>`;
            });
            headHtml += `</tr>`;
            thead.innerHTML = headHtml;

            // Рисуем строки
            tbody.innerHTML = '';
            scheduleData.rows.forEach((row, rIndex) => {
                const tr = document.createElement('tr');
                
                // Название (Расписание)
                const tdName = document.createElement('td');
                tdName.contentEditable = true;
                tdName.textContent = row.name;
                tdName.onblur = (e) => { scheduleData.rows[rIndex].name = e.target.textContent; saveData(); };
                
                // Время
                const tdTime = document.createElement('td');
                const timeInput = document.createElement('input');
                timeInput.type = 'time';
                timeInput.value = row.time;
                timeInput.onchange = (e) => { scheduleData.rows[rIndex].time = e.target.value; saveData(); };
                tdTime.appendChild(timeInput);
                
                tr.appendChild(tdName);
                tr.appendChild(tdTime);

                // Чекбоксы
                row.checks.forEach((isChecked, cIndex) => {
                    const td = document.createElement('td');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = isChecked;
                    cb.onchange = (e) => { 
                        scheduleData.rows[rIndex].checks[cIndex] = e.target.checked; 
                        saveData(); 
                    };
                    td.appendChild(cb);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        function editColName(index, newName) {
            if (index >= 0) scheduleData.columns[index] = newName;
            saveData();
        }

        function addColumn() {
            scheduleData.columns.push("ПР"); // По умолчанию "ПР", можно переименовать кликом
            scheduleData.rows.forEach(row => row.checks.push(false));
            renderSchedule();
            saveData();
        }

        function addRow() {
            scheduleData.rows.push({
                name: "Новое дело",
                time: "12:00",
                checks: Array(scheduleData.columns.length).fill(false)
            });
            renderSchedule();
            saveData();
        }

        // ==========================================
        // ЛОГИКА ДНЕВНИКА
        // ==========================================
        let diaryData = JSON.parse(localStorage.getItem('myDiary')) || {};
        let currentDiaryDay = "1";

        // Заполняем выпадающий список дней (от 1 до 30)
        const daySelect = document.getElementById('diary-day-select');
        for(let i=1; i<=30; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `День ${i}`;
            daySelect.appendChild(opt);
        }

        function loadDiary() {
            currentDiaryDay = daySelect.value;
            const data = diaryData[currentDiaryDay] || { text: "", mood: "", color: "#222222" };
            
            document.getElementById('diary-text').value = data.text;
            document.getElementById('diary-color').value = data.color;
            document.getElementById('diary-text').style.color = data.color;
            
            // Сброс смайликов
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            if (data.mood) {
                // Ищем кнопку с нужным смайликом и активируем
                const moods = ['😊', '😢', '😡', '😴'];
                const moodIndex = moods.indexOf(data.mood);
                if (moodIndex > -1) document.getElementById(`mood-${moodIndex+1}`).classList.add('active');
            }
        }

        function saveDiary() {
            const text = document.getElementById('diary-text').value;
            const color = document.getElementById('diary-color').value;
            
            // Находим активный смайлик
            let activeMood = "";
            const moods = ['😊', '😢', '😡', '😴'];
            document.querySelectorAll('.mood-btn').forEach((btn, idx) => {
                if (btn.classList.contains('active')) activeMood = moods[idx];
            });

            diaryData[currentDiaryDay] = { text: text, mood: activeMood, color: color };
            localStorage.setItem('myDiary', JSON.stringify(diaryData));
            showSaveIndicator();
        }

        function setMood(mood) {
            // Снимаем выделение со всех
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            // Выделяем текущий
            const moods = ['😊', '😢', '😡', '😴'];
            const index = moods.indexOf(mood);
            document.getElementById(`mood-${index+1}`).classList.add('active');
            saveDiary();
        }

        function changeDiaryColor() {
            const color = document.getElementById('diary-color').value;
            document.getElementById('diary-text').style.color = color;
            saveDiary();
        }

        // ==========================================
        // ОБЩИЕ ФУНКЦИИ
        // ==========================================
        function saveData() {
            localStorage.setItem('mySchedule', JSON.stringify(scheduleData));
            showSaveIndicator();
        }

        let saveTimer;
        function showSaveIndicator() {
            const ind = document.getElementById('save-indicator');
            ind.style.opacity = '1';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => { ind.style.opacity = '0'; }, 1500);
        }

        // Инициализация
        renderSchedule();
        loadDiary();
    </script>
</body>
</html>
