<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мульти-Планировщик со Временем</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-light: #16213e;
            --primary: #e94560;
            --text: #fff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- ЛЕТАЮЩИЕ ФИГУРЫ НА ФОНЕ --- */
        #bg-animations {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            opacity: 0.15;
            animation: floatAnim infinite linear;
        }

        @keyframes floatAnim {
            0% { transform: translateY(0) rotate(0deg) translateX(0); }
            50% { transform: translateY(-30px) rotate(180deg) translateX(20px); }
            100% { transform: translateY(0) rotate(360deg) translateX(0); }
        }

        .shape-triangle {
            width: 0; height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid #e94560;
        }
        .shape-square {
            width: 40px; height: 40px;
            background-color: #0f3460;
            border: 2px solid #533483;
        }
        .shape-circle {
            width: 45px; height: 45px;
            border-radius: 50%;
            background-color: #533483;
        }

        /* --- ОБЩИЕ ЭКРАНЫ --- */
        .screen {
            display: none;
            width: 100%; height: 100%;
            flex-direction: column;
            z-index: 10;
            animation: fadeIn 0.3s ease;
        }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- 1. ЭКРАН ВХОДА --- */
        #login-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
        }
        .logo { font-size: 80px; margin-bottom: 20px; animation: float 3s infinite alternate; }
        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        h1 { margin: 0 0 10px 0; font-size: 36px; }
        p { color: #ccc; margin-bottom: 40px; font-size: 16px; max-width: 400px; }
        
        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: white; color: #333;
            border: none; padding: 15px 30px;
            font-size: 18px; font-weight: 900;
            border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.2s;
        }
        .google-btn:hover { transform: scale(1.05); }
        .google-btn img { width: 24px; height: 24px; }

        /* --- 2. ЭКРАН ШАБЛОНОВ --- */
        #templates-screen {
            padding: 20px;
            overflow-y: auto;
        }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 15px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px; border: 1px solid var(--border);
            position: sticky; top: 0; z-index: 20;
            flex-wrap: wrap; gap: 10px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 14px; }
        
        .custom-input-group { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        .custom-input-group input {
            flex: 1; padding: 12px; border-radius: 10px;
            border: none; background: rgba(255,255,255,0.9);
            font-size: 16px; color: #333; font-weight: bold; outline: none;
        }
        .custom-input-group button {
            background: #0f3460; color: white; border: 2px solid #533483;
            padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding-bottom: 100px; 
        }
        .template-card {
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 110px;
            position: relative;
            border: 3px solid transparent;
        }
        .template-card:hover { transform: translateY(-5px); }
        .template-card.selected {
            border-color: #fff;
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .template-card.selected::after {
            content: '✓'; position: absolute; top: 5px; right: 10px;
            font-size: 20px; color: #fff; text-shadow: 0 0 5px #000;
        }
        
        .template-icon { font-size: 30px; margin-bottom: 5px; }

        #bottom-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: none;
            justify-content: center;
            z-index: 30;
        }
        #bottom-bar.active { display: flex; }
        .btn-create {
            background: var(--primary);
            color: white; border: none;
            padding: 15px 40px; border-radius: 30px;
            font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            width: 100%; max-width: 400px;
            transition: transform 0.2s;
        }
        .btn-create:active { transform: scale(0.95); }

        /* --- 3. ЭКРАН РЕДАКТОРА --- */
        #editor-screen { background: rgba(22, 33, 62, 0.95); }
        
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
        }
        .btn-back {
            background: rgba(255,255,255,0.1); border: none; color: white;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn-save {
            background: #2ed573; color: white; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        /* Таблица */
        .table-container { flex: 1; overflow: auto; padding: 20px; }
        table {
            border-collapse: collapse; width: 100%; min-width: 700px; /* Чуть шире из-за времени */
            background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            outline: none;
        }
        th {
            background: #0f3460;
            color: white; font-weight: 900; text-align: center;
            position: sticky; top: 0;
        }
        td { font-size: 15px; }
        
        .check-cell { text-align: center; width: 50px; }
        input[type="checkbox"] {
            width: 24px; height: 24px; cursor: pointer;
            accent-color: var(--primary);
        }
        
        .editable-cell { cursor: text; transition: background 0.2s; }
        .editable-cell:focus { background: rgba(255,255,255,0.1); }

        /* СТИЛИ ДЛЯ ИНПУТА ВРЕМЕНИ */
        input[type="time"] {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Nunito', sans-serif;
            outline: none;
            cursor: pointer;
            color-scheme: dark; /* Делает иконку часов белой в браузере */
        }
        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(1); /* Принудительно делаем иконку белой */
        }

        .add-row-btn {
            display: block; width: 100%; padding: 15px;
            background: rgba(255,255,255,0.1); color: white;
            border: 2px dashed var(--border); border-radius: 10px;
            margin-top: 15px; cursor: pointer; font-weight: bold;
        }
        .add-row-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="bg-animations"></div>

    <div id="login-screen" class="screen active">
        <div class="logo">⏱️</div>
        <h1>Мульти-Планировщик</h1>
        <p>Планируй свои дни по часам и достигай целей с комфортом!</p>
        <button class="google-btn" onclick="fakeGoogleLogin()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
            Войти через Google
        </button>
    </div>

    <div id="templates-screen" class="screen">
        <div class="header-bar">
            <div class="user-info">
                <div class="user-avatar" style="font-size:20px;">👤</div>
                <span>Мой Аккаунт</span>
            </div>
            <div class="custom-input-group">
                <input type="text" id="custom-input" placeholder="Свой вариант (напр. Футбол)..." onkeypress="handleKeyPress(event)">
                <button onclick="addCustomTemplate()">Добавить</button>
            </div>
        </div>
        <h2 style="margin-top: 10px;">Выбери цели (можно несколько):</h2>
        <div class="templates-grid" id="templates-grid"></div>
    </div>

    <div id="bottom-bar">
        <button class="btn-create" onclick="createCombinedTable()">Создать расписание</button>
    </div>

    <div id="editor-screen" class="screen">
        <div class="toolbar">
            <button class="btn-back" onclick="goBackToTemplates()">← Назад</button>
            <div style="font-size: 16px; font-weight: bold; color: var(--primary);" id="editor-title">Мой план</div>
            <button class="btn-save" onclick="saveTable()">Сохранить</button>
        </div>
        
        <div class="table-container">
            <table id="schedule-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <button class="add-row-btn" onclick="addNewRow()">+ Добавить еще один день</button>
        </div>
    </div>

    <script>
        // --- ФОНОВЫЕ АНИМАЦИИ ---
        const bgContainer = document.getElementById('bg-animations');
        const shapeClasses = ['shape-triangle', 'shape-square', 'shape-circle'];
        const emojis = ['📅', '🗓️', '📆', '⏰'];
        
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-item');
            
            if (Math.random() > 0.5) {
                el.classList.add(shapeClasses[Math.floor(Math.random() * shapeClasses.length)]);
            } else {
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.fontSize = (30 + Math.random() * 30) + 'px';
            }
            
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.animationDuration = (10 + Math.random() * 20) + 's';
            el.style.animationDelay = (Math.random() * 5) + 's';
            
            if(!el.textContent) {
                const hue = Math.floor(Math.random() * 360);
                if (el.classList.contains('shape-square') || el.classList.contains('shape-circle')) {
                    el.style.backgroundColor = `hsl(${hue}, 70%, 50%)`;
                    el.style.borderColor = `hsl(${hue}, 70%, 70%)`;
                } else if (el.classList.contains('shape-triangle')) {
                    el.style.borderBottomColor = `hsl(${hue}, 70%, 50%)`;
                }
            }
            bgContainer.appendChild(el);
        }

        // --- ДАННЫЕ ---
        const baseColors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A8', '#FFC300', '#8E44AD', '#E67E22', '#16A085', '#2980B9', '#C0392B', '#D35400', '#27AE60', '#2C3E50', '#F39C12', '#1ABC9C', '#9B59B6', '#34495E', '#F1C40F', '#FF6B6B', '#4ECDC4'];
        const baseNames = ["Спорт", "Учеба", "Работа", "Чтение", "Планы", "Здоровье", "Финансы", "Хобби", "Уборка", "Отдых", "Английский", "Тренировки", "Проекты", "Идеи", "Дневник", "Привычки", "Код", "Рисование", "Музыка", "Кулинария", "Йога", "Марафон", "Курс", "Задачи", "Дом"];
        const icons = ["🏃", "📚", "💼", "📖", "📝", "❤️", "💰", "🎨", "🧹", "🌴", "🇬🇧", "💪", "🚀", "💡", "📔", "🔥", "💻", "🖌️", "🎵", "🍳"];

        let allTemplates = [];
        for (let i = 0; i < 25; i++) {
            allTemplates.push({ id: 't_' + i, name: baseNames[i], color: baseColors[i], icon: icons[i % icons.length] });
        }

        let selectedTemplates = []; 
        let currentTableData = [];  
        let tableHeaders = [];      

        // --- 1. ВХОД ---
        function fakeGoogleLogin() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('templates-screen').classList.add('active');
            renderTemplates();
        }

        // --- 2. ОТРИСОВКА ШАБЛОНОВ ---
        function renderTemplates() {
            const grid = document.getElementById('templates-grid');
            grid.innerHTML = '';
            
            allTemplates.forEach(tpl => {
                const card = document.createElement('div');
                card.classList.add('template-card');
                card.style.backgroundColor = tpl.color;
                card.style.textShadow = "1px 1px 3px rgba(0,0,0,0.5)";
                
                if (selectedTemplates.some(t => t.id === tpl.id)) {
                    card.classList.add('selected');
                }

                card.innerHTML = `<div class="template-icon">${tpl.icon}</div><div>${tpl.name}</div>`;
                card.onclick = () => toggleTemplate(tpl);
                
                grid.appendChild(card);
            });
        }

        // --- 3. ВЫБОР ШАБЛОНОВ ---
        function toggleTemplate(tpl) {
            const index = selectedTemplates.findIndex(t => t.id === tpl.id);
            if (index > -1) selectedTemplates.splice(index, 1);
            else selectedTemplates.push(tpl);
            
            renderTemplates();
            document.getElementById('bottom-bar').classList.toggle('active', selectedTemplates.length > 0);
        }

        // --- 4. ДОБАВЛЕНИЕ СВОЕГО ШАБЛОНА ---
        function handleKeyPress(e) { if (e.key === 'Enter') addCustomTemplate(); }

        function addCustomTemplate() {
            const input = document.getElementById('custom-input');
            const name = input.value.trim();
            if (!name) return;

            const newColor = `hsl(${Math.floor(Math.random() * 360)}, 70%, 50%)`;
            const newIcon = ["⚽", "🎸", "🐶", "🍕", "🎮", "✈️"][Math.floor(Math.random() * 6)];
            
            const newTpl = { id: 'custom_' + Date.now(), name: name, color: newColor, icon: newIcon };
            allTemplates.push(newTpl);
            input.value = '';
            toggleTemplate(newTpl);
        }

        // --- 5. СОЗДАНИЕ ТАБЛИЦЫ ---
        function createCombinedTable() {
            if (selectedTemplates.length === 0) return;

            tableHeaders = selectedTemplates.map(t => t.name);
            
            document.getElementById('templates-screen').classList.remove('active');
            document.getElementById('editor-screen').classList.add('active');
            document.getElementById('bottom-bar').classList.remove('active');

            // Формируем шапку с колонкой ВРЕМЯ
            const thead = document.getElementById('table-head');
            let headHtml = `<tr>
                <th style="width: 40px;">№</th>
                <th style="width: 110px;">День</th>
                <th style="width: 110px;">⏰ Время</th>`;
            tableHeaders.forEach((h) => { headHtml += `<th>${h}</th>`; });
            headHtml += `<th>Свои задачи</th></tr>`;
            thead.innerHTML = headHtml;

            const saveKey = 'planner_time_' + tableHeaders.join('_');
            const saved = localStorage.getItem(saveKey);
            
            if (saved) {
                currentTableData = JSON.parse(saved);
            } else {
                currentTableData = [];
                for (let i = 1; i <= 30; i++) {
                    currentTableData.push({
                        day: `День ${i}`,
                        time: '', // Добавили поле времени
                        checks: Array(tableHeaders.length).fill(false),
                        notes: ''
                    });
                }
            }
            renderCombinedTable();
        }

        // --- 6. ОТРИСОВКА ТАБЛИЦЫ ---
        function renderCombinedTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            currentTableData.forEach((row, rIndex) => {
                const tr = document.createElement('tr');
                
                // №
                const tdNum = document.createElement('td');
                tdNum.textContent = rIndex + 1;
                tdNum.style.textAlign = 'center';
                tdNum.style.color = '#aaa';
                
                // День
                const tdDay = document.createElement('td');
                tdDay.textContent = row.day;
                tdDay.contentEditable = true;
                tdDay.classList.add('editable-cell');
                tdDay.onblur = (e) => { currentTableData[rIndex].day = e.target.textContent; };
                
                // ВРЕМЯ
                const tdTime = document.createElement('td');
                tdTime.style.textAlign = 'center';
                const timeInput = document.createElement('input');
                timeInput.type = 'time';
                timeInput.value = row.time || ''; // Загружаем время (или пусто)
                timeInput.onchange = (e) => { 
                    currentTableData[rIndex].time = e.target.value; 
                    saveTable(); // Автосохранение при смене времени
                };
                tdTime.appendChild(timeInput);
                
                tr.appendChild(tdNum);
                tr.appendChild(tdDay);
                tr.appendChild(tdTime); // Добавили ячейку времени

                // Чекбоксы
                row.checks.forEach((isChecked, cIndex) => {
                    const tdCheck = document.createElement('td');
                    tdCheck.classList.add('check-cell');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = isChecked;
                    checkbox.onchange = (e) => { 
                        currentTableData[rIndex].checks[cIndex] = e.target.checked; 
                        saveTable();
                    };
                    tdCheck.appendChild(checkbox);
                    tr.appendChild(tdCheck);
                });

                // Заметки
                const tdNotes = document.createElement('td');
                tdNotes.textContent = row.notes;
                tdNotes.contentEditable = true;
                tdNotes.classList.add('editable-cell');
                tdNotes.placeholder = "Что еще?";
                tdNotes.onblur = (e) => { currentTableData[rIndex].notes = e.target.textContent; };

                tr.appendChild(tdNotes);
                tbody.appendChild(tr);
            });
        }

        // --- 7. ДОБАВИТЬ ДЕНЬ ---
        function addNewRow() {
            const newDayNum = currentTableData.length + 1;
            currentTableData.push({
                day: `День ${newDayNum}`,
                time: '',
                checks: Array(tableHeaders.length).fill(false),
                notes: ''
            });
            renderCombinedTable();
            document.querySelector('.table-container').scrollTop = document.querySelector('.table-container').scrollHeight;
        }

        // --- 8. СОХРАНЕНИЕ ---
        function saveTable() {
            const saveKey = 'planner_time_' + tableHeaders.join('_');
            localStorage.setItem(saveKey, JSON.stringify(currentTableData));
            
            const btn = document.querySelector('.btn-save');
            btn.textContent = '✓ Сохранено';
            btn.style.background = '#1e90ff'; // Синий при сохранении
            setTimeout(() => { 
                btn.textContent = 'Сохранить'; 
                btn.style.background = '#2ed573';
            }, 2000);
        }

        // --- 9. НАЗАД ---
        function goBackToTemplates() {
            if (tableHeaders.length > 0) {
                const saveKey = 'planner_time_' + tableHeaders.join('_');
                localStorage.setItem(saveKey, JSON.stringify(currentTableData));
            }
            document.getElementById('editor-screen').classList.remove('active');
            document.getElementById('templates-screen').classList.add('active');
            if (selectedTemplates.length > 0) document.getElementById('bottom-bar').classList.add('active');
        }
    </script>
</body>
</html>
